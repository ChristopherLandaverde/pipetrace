name: pipetrace
version: 1.0.0
config-version: 2
require-dbt-version: [">=1.10.5", "<2.0.0"]
profile: foco_bigquery
model-paths: [models]
analysis-paths: [analyses]
test-paths: [tests]
macro-paths: [macros]
seed-paths: [seeds]
clean-targets: [target, dbt_packages]
vars:
  ga4_dataset: analytics_demo
  hubspot_dataset: hubspot_demo
  salesforce_dataset: salesforce_demo
  ga4_timezone: UTC
  ga4_lookback_days: 90
  ga4_boundary_buffer_days: 2
  ga4_start_date: null
  ga4_end_date: null
  attribution_lookback_days: 90
  lead_conversion_events: [generate_lead, form_submit, demo_request]
  # Which loader produced the CRM tables: native (docs/source-contracts.md),
  # fivetran or airbyte. Override table names with hubspot_contacts_table,
  # sfdc_lead_table and sfdc_opportunity_table.
  pipetrace_connector: native
  # Matching fields. Names are case-sensitive and may be absent: a missing
  # column reads as NULL, and that attribution level is simply not reached.
  ga4_conversion_token_param: original_conversion_id
  hubspot_conversion_token_property: property_original_conversion_id
  hubspot_ga_client_id_property: property_ga_client_id
  sfdc_lead_conversion_token_field: Original_Conversion_Id__c
  sfdc_lead_ga_client_id_field: GA_Client_ID__c
  sfdc_lead_first_touch_source_field: First_Touch_Source__c
  sfdc_lead_first_touch_medium_field: First_Touch_Medium__c
  sfdc_lead_first_touch_campaign_field: First_Touch_Campaign__c
  sfdc_opportunity_conversion_token_field: Original_Conversion_Id__c
  sfdc_opportunity_ga_client_id_field: GA_Client_ID__c
  # Attribution levels: 2 conversion token, 1 GA4 client ID, 0 CRM source.
  enable_ga_client_id_matching: true
  enable_crm_source_fallback: true
models:
  pipetrace:
    +persist_docs: {relation: true, columns: true}
    staging:
      +materialized: view
      +tags: [restricted]
    intermediate:
      +materialized: table
      +tags: [restricted]
    marts:
      +materialized: table
      +tags: [readable_layer]
    readiness:
      +materialized: table
