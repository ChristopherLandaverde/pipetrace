name: pipetrace
version: 1.0.0
config-version: 2
require-dbt-version: [">=1.10.5", "<2.0.0"]
profile: foco_bigquery
model-paths: [models]
analysis-paths: [analyses]
test-paths: [tests]
macro-paths: [macros]
seed-paths: [seeds]
clean-targets: [target, dbt_packages]
vars:
  ga4_dataset: analytics_demo
  hubspot_dataset: hubspot_demo
  salesforce_dataset: salesforce_demo
  ga4_timezone: UTC
  ga4_lookback_days: 90
  ga4_boundary_buffer_days: 2
  ga4_start_date: null
  ga4_end_date: null
  attribution_lookback_days: 90
  lead_conversion_events: [generate_lead, form_submit, demo_request]
models:
  pipetrace:
    +persist_docs: {relation: true, columns: true}
    staging:
      +materialized: view
      +tags: [restricted]
    intermediate:
      +materialized: table
      +tags: [restricted]
    marts:
      +materialized: table
      +tags: [readable_layer]
