name: Native BigQuery walkthrough
# Synthetic data only. Runs the dbt build against a disposable fixture in a
# development project. Auth is Workload Identity Federation: no key file.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'models/**'
      - 'macros/**'
      - 'tests/**'
      - 'dbt_project.yml'
      - 'packages.yml'
      - 'package-lock.yml'
      - 'requirements.txt'
      - 'profiles.yml.example'
      - 'analyses/**'
      - 'scripts/run_walkthrough.sh'
      - 'scripts/generate_fixture.py'
      - '.github/workflows/walkthrough.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: walkthrough-${{ github.ref }}
  cancel-in-progress: true
# Not secrets: these say where to authenticate. Access is limited by the
# provider's condition to this repository, and by the service account's roles
# (BigQuery Job User + Data Editor on foco-revops-ci only).
env:
  GCP_PROJECT_ID: foco-revops-ci
  GCP_LOCATION: US
  GCP_SERVICE_ACCOUNT: foco-ci-walkthrough@foco-revops-ci.iam.gserviceaccount.com
  GCP_WIF_PROVIDER: projects/449425147668/locations/global/workloadIdentityPools/github/providers/foco-revops-warehouse
jobs:
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: bash scripts/run_walkthrough.sh "$GCP_PROJECT_ID" "$GCP_LOCATION"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-logs
          path: logs/
          retention-days: 7
