name: Validate package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/test_local.py
      - run: python scripts/check_repository.py
      - run: python scripts/test_agents.py
      - run: python scripts/generate_fixture.py --project synthetic-demo > /tmp/fixture.sql
      - run: dbt deps
      - run: dbt parse --profiles-dir ci --no-partial-parse
# This job parses dbt and executes relational fixtures. It does not validate against BigQuery.
# Run docs/synthetic-walkthrough.md in a development project before promotion.
