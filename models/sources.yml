version: 2
sources:
  - name: ga4
    database: "{{ var('ga4_project', target.project) }}"
    schema: "{{ var('ga4_dataset') }}"
    description: Daily GA4 export only. Intraday tables are excluded by the suffix range.
    tables:
      - name: events
        identifier: events_*
  - name: hubspot
    database: "{{ var('hubspot_project', target.project) }}"
    schema: "{{ var('hubspot_dataset') }}"
    tables:
      - name: contacts
        identifier: "{{ var('hubspot_contacts_table', {'fivetran': 'contact'}.get(var('pipetrace_connector', 'native') | lower, 'contacts')) }}"
        description: Current contact snapshot with the property_* contract in docs/source-contracts.md.
  - name: salesforce
    database: "{{ var('salesforce_project', target.project) }}"
    schema: "{{ var('salesforce_dataset') }}"
    tables:
      - name: leads
        identifier: "{{ var('sfdc_lead_table', {'fivetran': 'lead'}.get(var('pipetrace_connector', 'native') | lower, 'Lead')) }}"
      - name: opportunities
        identifier: "{{ var('sfdc_opportunity_table', {'fivetran': 'opportunity'}.get(var('pipetrace_connector', 'native') | lower, 'Opportunity')) }}"
