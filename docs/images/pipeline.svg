<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-label="PipeTrace pipeline. Sources: GA4 daily export, HubSpot contacts, Salesforce leads and opportunities. Staging views coerce parameters and keep conversion tokens. int_ga4_sessions builds one row per user and session ID, so a session that crosses midnight counts once. int_session_conversion_tokens keeps every token per session. int_crm_touchpoint_linkage joins tokens to opportunities by ranked deterministic ID paths, keeping unmatched deals. fct_revops_pipeline_attribution weights each opportunity's sessions first-observed and linear, each summing to 1. fct_pipeline_attribution_daily is the BI surface by date, channel, currency and revenue basis. Checks guard each step: midnight duplication, shared tokens, opportunity coverage, weights sum to 1, pipeline reconciles to source. Model names are shown without their pipetrace_ prefix.">
  <style>
    .box{fill:#F3F0E6;stroke:#10231F;stroke-opacity:.18;stroke-width:1.5}
    .src{fill:#EBE8DE;stroke:#10231F;stroke-opacity:.18;stroke-width:1.5}
    .out{fill:#10231F}
    .t{font:500 14px Inter,system-ui,-apple-system,sans-serif;fill:#10231F}
    .m{font:12px 'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#426B5D}
    .w{font:500 14px Inter,system-ui,-apple-system,sans-serif;fill:#FFFFFF}
    .wm{font:12px 'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#FFFFFF;fill-opacity:.8}
    .k{font:500 12px 'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#10231F}
    .l{font:600 11px 'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#426B5D;letter-spacing:.06em}
    .a{fill:none;stroke:#10231F;stroke-opacity:.45;stroke-width:1.5}
  </style>
  <rect width="880" height="400" fill="#F3F0E6"/>
  <defs><marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8z" fill="#10231F" fill-opacity=".45"/></marker></defs>

  <text class="l" x="24" y="34">□ OBSERVED</text>
  <text class="l" x="232" y="34">↓ TRACED</text>
  <text class="l" x="512" y="34">+ REPAIRED</text>
  <text class="l" x="712" y="34">✓ VERIFIED</text>

  <rect class="src" x="24" y="52" width="180" height="62" rx="8"/>
  <text class="t" x="40" y="78">GA4 daily export</text>
  <text class="m" x="40" y="98">events_YYYYMMDD</text>
  <rect class="src" x="24" y="132" width="180" height="62" rx="8"/>
  <text class="t" x="40" y="158">HubSpot contacts</text>
  <text class="m" x="40" y="178">conversion token</text>
  <rect class="src" x="24" y="212" width="180" height="62" rx="8"/>
  <text class="t" x="40" y="238">Salesforce</text>
  <text class="m" x="40" y="258">leads, opportunities</text>

  <rect class="box" x="232" y="52" width="252" height="62" rx="8"/>
  <text class="t" x="248" y="78">int_ga4_sessions</text>
  <text class="m" x="248" y="98">1 row per user + session ID</text>
  <rect class="box" x="232" y="132" width="252" height="62" rx="8"/>
  <text class="t" x="248" y="158">int_session_conversion_tokens</text>
  <text class="m" x="248" y="178">every token, every session</text>
  <rect class="box" x="232" y="212" width="252" height="62" rx="8"/>
  <text class="t" x="248" y="238">int_crm_touchpoint_linkage</text>
  <text class="m" x="248" y="258">ranked ID paths, unmatched kept</text>

  <rect class="box" x="512" y="132" width="176" height="62" rx="8"/>
  <text class="t" x="528" y="158">fct_revops_pipeline_</text>
  <text class="t" x="528" y="176">attribution</text>
  <rect class="out" x="512" y="212" width="176" height="62" rx="8"/>
  <text class="w" x="528" y="238">fct_pipeline_</text>
  <text class="w" x="528" y="256">attribution_daily</text>

  <path class="a" d="M204 83H232" marker-end="url(#h)"/>
  <path class="a" d="M358 114V132" marker-end="url(#h)"/>
  <path class="a" d="M358 194V212" marker-end="url(#h)"/>
  <path class="a" d="M204 163C218 163 218 233 232 233" marker-end="url(#h)"/>
  <path class="a" d="M204 243H232" marker-end="url(#h)"/>
  <path class="a" d="M484 243C498 243 498 163 512 163" marker-end="url(#h)"/>
  <path class="a" d="M600 194V212" marker-end="url(#h)"/>

  <text class="k" x="712" y="72">✓ midnight sessions</text>
  <text class="m" x="712" y="90">  count once</text>
  <text class="k" x="712" y="122">✓ no token shared</text>
  <text class="m" x="712" y="140">  across users</text>
  <text class="k" x="712" y="172">✓ every opportunity</text>
  <text class="m" x="712" y="190">  present</text>
  <text class="k" x="712" y="222">✓ weights sum to 1</text>
  <text class="m" x="712" y="240">  per opportunity</text>
  <text class="k" x="712" y="272">✓ pipeline reconciles</text>
  <text class="m" x="712" y="290">  to source value</text>

  <line x1="24" y1="320" x2="856" y2="320" stroke="#10231F" stroke-opacity=".15"/>
  <text class="m" x="24" y="348">BigQuery · dbt · 14 models (shown without the pipetrace_ prefix) · read-only on sources</text>
  <text class="m" x="24" y="370">Run on synthetic data in CI: 54 of 54 pass. Walkthrough / no client data.</text>
</svg>
